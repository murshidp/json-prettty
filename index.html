<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JSON Prettifier — Format & Validate JSON</title>
<meta name="description" content="A fast, private JSON formatter, validator and minifier. Runs entirely in your browser.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%237c5cff'/><text x='16' y='22' font-family='monospace' font-size='16' font-weight='700' text-anchor='middle' fill='white'>{}</text></svg>">
<style>
  :root {
    --bg: #fafafa; --bg-grid: rgba(0,0,0,.035);
    --surface: rgba(255,255,255,.75); --surface-solid: #ffffff;
    --border: rgba(0,0,0,.08); --border-strong: rgba(0,0,0,.14);
    --text: #0b0b10; --muted: #6b6b76; --faint: #a3a3ad;
    --accent: #6d4aff; --accent-2: #00b8d9; --accent-soft: rgba(109,74,255,.1);
    --ok: #10a35a; --err: #e5484d;
    --k: #6d4aff; --s: #0a8f5c; --n: #d9570b; --b: #0a7bd6; --nl: #c22d6b; --p: #8a8a96;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.06);
  }
  :root[data-theme="dark"] {
    --bg: #09090b; --bg-grid: rgba(255,255,255,.035);
    --surface: rgba(24,24,28,.7); --surface-solid: #141417;
    --border: rgba(255,255,255,.08); --border-strong: rgba(255,255,255,.16);
    --text: #f4f4f6; --muted: #9b9ba6; --faint: #5c5c66;
    --accent: #8b74ff; --accent-2: #22d3ee; --accent-soft: rgba(139,116,255,.14);
    --ok: #3ddc84; --err: #ff6b6b;
    --k: #a99bff; --s: #5ee3a1; --n: #ffb86b; --b: #6cc4ff; --nl: #ff7ab2; --p: #6e6e7a;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 32px rgba(0,0,0,.35);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; color: var(--text); background: var(--bg);
    font: 14px/1.5 Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    background-image:
      radial-gradient(800px 400px at 15% -10%, var(--accent-soft), transparent 70%),
      radial-gradient(600px 300px at 95% 0%, rgba(34,211,238,.08), transparent 70%),
      linear-gradient(var(--bg-grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--bg-grid) 1px, transparent 1px);
    background-size: auto, auto, 32px 32px, 32px 32px;
    transition: background-color .2s, color .2s;
  }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 0 20px; }

  /* Nav */
  nav { display: flex; align-items: center; justify-content: space-between; padding: 18px 0; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 15px; letter-spacing: -.01em; }
  .logo {
    width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center;
    background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff;
    font: 700 13px "JetBrains Mono", monospace; box-shadow: 0 4px 14px var(--accent-soft);
  }
  .badge {
    font-size: 11px; font-weight: 500; color: var(--muted); padding: 3px 8px;
    border: 1px solid var(--border); border-radius: 999px; background: var(--surface);
  }
  .icon-btn {
    width: 36px; height: 36px; display: grid; place-items: center; border-radius: 10px;
    border: 1px solid var(--border); background: var(--surface); color: var(--text); cursor: pointer;
    backdrop-filter: blur(12px); transition: border-color .15s, transform .15s;
  }
  .icon-btn:hover { border-color: var(--border-strong); }
  .icon-btn:active { transform: scale(.95); }
  .icon-btn svg { width: 17px; height: 17px; }

  /* Hero */
  .hero { padding: 28px 0 26px; }
  .hero h1 {
    margin: 0; font-size: clamp(28px, 4.5vw, 44px); font-weight: 700; letter-spacing: -.035em; line-height: 1.1;
  }
  .hero h1 span {
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .hero p { margin: 10px 0 0; color: var(--muted); font-size: 15px; max-width: 560px; }

  /* Toolbar */
  .toolbar {
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 8px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    backdrop-filter: blur(16px); box-shadow: var(--shadow); margin-bottom: 14px;
  }
  .btn {
    display: inline-flex; align-items: center; gap: 7px; height: 36px; padding: 0 14px;
    font: 500 13px Inter, sans-serif; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; background: transparent; color: var(--text);
    transition: background .15s, border-color .15s, transform .1s, box-shadow .15s;
  }
  .btn svg { width: 15px; height: 15px; }
  .btn:hover { background: var(--accent-soft); }
  .btn:active { transform: scale(.97); }
  .btn.primary {
    color: #fff; background: linear-gradient(135deg, var(--accent), #5a3cf0);
    box-shadow: 0 4px 14px var(--accent-soft), inset 0 1px 0 rgba(255,255,255,.2);
  }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn kbd {
    font: 500 10px "JetBrains Mono", monospace; padding: 1px 5px; border-radius: 4px;
    background: rgba(255,255,255,.18);
  }
  .divider { width: 1px; height: 22px; background: var(--border); }
  .seg { display: inline-flex; padding: 3px; background: var(--accent-soft); border-radius: 9px; }
  .seg button {
    height: 30px; padding: 0 11px; font: 500 12px Inter, sans-serif; color: var(--muted);
    border: 0; background: transparent; border-radius: 7px; cursor: pointer; transition: all .15s;
  }
  .seg button.on { background: var(--surface-solid); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .toggle { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); cursor: pointer; user-select: none; }
  .toggle input { display: none; }
  .switch {
    width: 32px; height: 18px; border-radius: 999px; background: var(--border-strong); position: relative; transition: background .2s;
  }
  .switch::after {
    content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%;
    background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.3); transition: transform .2s;
  }
  .toggle input:checked + .switch { background: var(--accent); }
  .toggle input:checked + .switch::after { transform: translateX(14px); }
  .grow { flex: 1; }

  /* Editors */
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 860px) { .grid { grid-template-columns: 1fr; } .divider { display: none; } }
  .panel {
    display: flex; flex-direction: column; min-width: 0; height: 62vh; min-height: 380px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
    backdrop-filter: blur(16px); box-shadow: var(--shadow); overflow: hidden;
    transition: border-color .2s, box-shadow .2s;
  }
  .panel.drag { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
  .panel.invalid { border-color: color-mix(in srgb, var(--err) 50%, transparent); }
  .panel-head {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 10px 12px 10px 16px; border-bottom: 1px solid var(--border);
  }
  .panel-title { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 13px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); transition: background .2s; }
  .dot.ok { background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 20%, transparent); }
  .dot.err { background: var(--err); box-shadow: 0 0 0 3px color-mix(in srgb, var(--err) 20%, transparent); }
  .panel-actions { display: flex; gap: 2px; }
  .mini {
    height: 28px; padding: 0 9px; display: inline-flex; align-items: center; gap: 6px;
    font: 500 12px Inter, sans-serif; color: var(--muted); background: transparent;
    border: 0; border-radius: 7px; cursor: pointer; transition: all .15s;
  }
  .mini:hover { color: var(--text); background: var(--accent-soft); }
  .mini svg { width: 14px; height: 14px; }
  .body { position: relative; flex: 1; min-height: 0; display: flex; }
  .code-font { font: 13px/1.65 "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; }
  textarea {
    flex: 1; resize: none; border: 0; outline: 0; padding: 14px 16px; background: transparent; color: var(--text);
    tab-size: 2; white-space: pre; overflow: auto;
  }
  textarea::placeholder { color: var(--faint); }
  .out { flex: 1; overflow: auto; display: flex; }
  .gutter {
    padding: 14px 10px 14px 14px; text-align: right; color: var(--faint); user-select: none;
    border-right: 1px solid var(--border); position: sticky; left: 0; background: var(--surface-solid);
    min-width: 44px; white-space: pre;
  }
  pre { margin: 0; padding: 14px 16px; flex: 1; white-space: pre; }
  .k { color: var(--k); } .s { color: var(--s); } .n { color: var(--n); }
  .b { color: var(--b); } .nl { color: var(--nl); font-style: italic; } .p { color: var(--p); }
  .empty {
    position: absolute; inset: 0; display: grid; place-items: center; text-align: center;
    color: var(--faint); pointer-events: none; padding: 20px;
  }
  .empty svg { width: 36px; height: 36px; margin-bottom: 8px; opacity: .6; }
  .error-box {
    margin: 16px; padding: 14px 16px; border-radius: 12px; align-self: flex-start; flex: 1;
    background: color-mix(in srgb, var(--err) 9%, transparent);
    border: 1px solid color-mix(in srgb, var(--err) 30%, transparent); color: var(--err);
  }
  .error-box strong { display: block; margin-bottom: 4px; font-size: 13px; }
  .error-box code { font: 12px/1.6 "JetBrains Mono", monospace; color: var(--text); opacity: .85; word-break: break-word; }

  /* Footer stats */
  .stats { display: flex; flex-wrap: wrap; gap: 8px; padding: 14px 0 6px; }
  .chip {
    display: inline-flex; gap: 6px; align-items: center; font-size: 12px; color: var(--muted);
    padding: 5px 10px; border-radius: 999px; background: var(--surface); border: 1px solid var(--border);
  }
  .chip b { color: var(--text); font-weight: 600; }
  footer { padding: 18px 0 32px; color: var(--faint); font-size: 12px; display: flex; gap: 6px; align-items: center; }
  footer svg { width: 13px; height: 13px; }

  /* Toast */
  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translate(-50%, 20px); opacity: 0;
    padding: 10px 16px; border-radius: 10px; font-size: 13px; font-weight: 500;
    background: var(--text); color: var(--bg); box-shadow: var(--shadow);
    transition: all .25s cubic-bezier(.2,.8,.2,1); pointer-events: none; z-index: 10;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 10px; border: 3px solid transparent; background-clip: content-box; }
  ::-webkit-scrollbar-corner { background: transparent; }
</style>
<script>
  // Apply saved/system theme before paint
  (function () {
    var t = null;
    try { t = localStorage.getItem("theme"); } catch (e) {}
    if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    document.documentElement.setAttribute("data-theme", t);
  })();
</script>
</head>
<body>
<div class="wrap">
  <nav>
    <div class="brand"><div class="logo">{}</div> JSON Prettifier <span class="badge">100% client-side</span></div>
    <button class="icon-btn" id="themeBtn" aria-label="Toggle theme">
      <svg id="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg id="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </nav>

  <section class="hero">
    <h1>Beautify JSON <span>instantly.</span></h1>
    <p>Format, validate and minify JSON with precise error locations. Your data never leaves your browser.</p>
  </section>

  <div class="toolbar">
    <button class="btn primary" id="formatBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h10M4 18h13"/></svg>
      Format <kbd>⌘↵</kbd>
    </button>
    <button class="btn" id="minifyBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 14h6v6M20 10h-6V4M14 10l7-7M3 21l7-7"/></svg>
      Minify
    </button>
    <div class="divider"></div>
    <div class="seg" id="indentSeg" role="group" aria-label="Indentation">
      <button data-v="2" class="on">2 spaces</button>
      <button data-v="4">4 spaces</button>
      <button data-v="tab">Tab</button>
    </div>
    <label class="toggle"><input type="checkbox" id="sortKeys"><span class="switch"></span> Sort keys</label>
    <label class="toggle"><input type="checkbox" id="live" checked><span class="switch"></span> Live</label>
    <span class="grow"></span>
    <button class="btn" id="sampleBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3l1.9 5.8L20 10l-6.1 1.2L12 17l-1.9-5.8L4 10l6.1-1.2z"/></svg>
      Sample
    </button>
  </div>

  <div class="grid">
    <div class="panel" id="inPanel">
      <div class="panel-head">
        <div class="panel-title"><span class="dot" id="dot"></span> Input</div>
        <div class="panel-actions">
          <button class="mini" id="pasteBtn" title="Paste from clipboard">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/></svg>Paste</button>
          <button class="mini" id="uploadBtn" title="Open a .json file">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>Open</button>
          <button class="mini" id="clearBtn" title="Clear">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>Clear</button>
          <input type="file" id="file" accept=".json,application/json,text/plain" hidden>
        </div>
      </div>
      <div class="body">
        <textarea id="input" class="code-font" spellcheck="false" autocomplete="off" placeholder='Paste JSON or drop a .json file here…'></textarea>
      </div>
    </div>

    <div class="panel" id="outPanel">
      <div class="panel-head">
        <div class="panel-title">Output</div>
        <div class="panel-actions">
          <button class="mini" id="copyBtn" title="Copy output">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>Copy</button>
          <button class="mini" id="downloadBtn" title="Download .json">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>Download</button>
        </div>
      </div>
      <div class="body" id="outBody">
        <div class="empty" id="empty">
          <div>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M8 3H7a2 2 0 0 0-2 2v5a2 2 0 0 1-2 2 2 2 0 0 1 2 2v5a2 2 0 0 0 2 2h1M16 3h1a2 2 0 0 1 2 2v5a2 2 0 0 0 2 2 2 2 0 0 0-2 2v5a2 2 0 0 1-2 2h-1"/></svg>
            <div>Formatted JSON will appear here</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="stats" id="stats"></div>

  <footer>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    Private by design. Nothing is uploaded, and it works offline once loaded.
  </footer>
</div>

<div class="toast" id="toast"></div>

<script>
  const $ = (id) => document.getElementById(id);
  const input = $("input"), outBody = $("outBody"), empty = $("empty"), dot = $("dot");
  let indent = "2", lastOutput = "", timer;

  // Theme
  const root = document.documentElement;
  function syncThemeIcon() {
    const dark = root.getAttribute("data-theme") === "dark";
    $("sun").style.display = dark ? "block" : "none";
    $("moon").style.display = dark ? "none" : "block";
  }
  $("themeBtn").onclick = () => {
    const next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
    root.setAttribute("data-theme", next);
    try { localStorage.setItem("theme", next); } catch (e) {}
    syncThemeIcon();
  };
  syncThemeIcon();

  // Helpers
  const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  function highlight(json) {
    return esc(json).replace(
      /("(?:\\u[a-fA-F0-9]{4}|\\[^u]|[^\\"])*")(\s*:)?|\b(true|false)\b|\bnull\b|-?\d+(?:\.\d+)?(?:[eE][+\-]?\d+)?|[{}\[\],]/g,
      (m, str, colon, bool) => {
        if (str) return colon ? `<span class="k">${str}</span><span class="p">${colon}</span>` : `<span class="s">${str}</span>`;
        if (bool) return `<span class="b">${m}</span>`;
        if (m === "null") return `<span class="nl">${m}</span>`;
        if (/^[{}\[\],]$/.test(m)) return `<span class="p">${m}</span>`;
        return `<span class="n">${m}</span>`;
      }
    );
  }
  function sortDeep(v) {
    if (Array.isArray(v)) return v.map(sortDeep);
    if (v && typeof v === "object") return Object.keys(v).sort().reduce((o, k) => (o[k] = sortDeep(v[k]), o), {});
    return v;
  }
  function analyze(v, d = 1) {
    let keys = 0, depth = d;
    if (v && typeof v === "object") {
      const vals = Array.isArray(v) ? v : Object.values(v);
      if (!Array.isArray(v)) keys += vals.length;
      for (const x of vals) { const r = analyze(x, d + 1); keys += r.keys; depth = Math.max(depth, r.depth); }
    }
    return { keys, depth };
  }
  function locate(text, msg) {
    let m = msg.match(/line (\d+) column (\d+)/i);
    if (m) {
      const lines = text.split("\n"), line = +m[1], col = +m[2];
      const pos = lines.slice(0, line - 1).reduce((a, l) => a + l.length + 1, 0) + col - 1;
      return { line, col, pos };
    }
    m = msg.match(/position (\d+)/i);
    if (!m) return null;
    const pos = +m[1], before = text.slice(0, pos).split("\n");
    return { line: before.length, col: before[before.length - 1].length + 1, pos };
  }
  // Normalize Python-style data into JSON:
  //  - 'abc'                      -> "abc"
  //  - True / False / None        -> true / false / null
  //  - "True" / 'False' / "None"  -> true / false / null  (values only; object keys stay strings)
  const PY_LITERALS = { True: "true", False: "false", None: "null" };
  function normalizeJson(t) {
    let out = "", i = 0, changed = false;
    const isKey = (j) => { while (j < t.length && /\s/.test(t[j])) j++; return t[j] === ":"; };
    while (i < t.length) {
      const c = t[i];
      if (c === '"' || c === "'") {
        const q = c; let j = i + 1, s = "";
        while (j < t.length && t[j] !== q) {
          if (t[j] === "\\") {
            if (q === "'" && t[j + 1] === "'") { s += "'"; j += 2; continue; }
            s += t[j] + (t[j + 1] ?? ""); j += 2; continue;
          }
          s += q === "'" && t[j] === '"' ? '\\"' : t[j]; j++;
        }
        if (j >= t.length) { out += t.slice(i); break; } // unterminated string: leave as is
        const end = j + 1;
        if (PY_LITERALS[s] && !isKey(end)) { out += PY_LITERALS[s]; changed = true; }
        else { out += '"' + s + '"'; if (q === "'") changed = true; }
        i = end;
      } else if (/[A-Za-z_]/.test(c)) {
        let j = i; while (j < t.length && /\w/.test(t[j])) j++;
        const w = t.slice(i, j);
        if (PY_LITERALS[w]) { out += PY_LITERALS[w]; changed = true; } else out += w;
        i = j;
      } else { out += c; i++; }
    }
    return { text: out, changed };
  }
  // Normalize first; if nothing needed changing (or the result still fails), use strict parsing.
  function parseLenient(text) {
    if (/['"]|True|False|None/.test(text)) {
      const f = normalizeJson(text);
      if (f.changed) { try { return { data: JSON.parse(f.text), fixed: f.text }; } catch {} }
    }
    return { data: JSON.parse(text), fixed: null };
  }
  const fmtBytes = (n) => n < 1024 ? n + " B" : n < 1048576 ? (n / 1024).toFixed(1) + " KB" : (n / 1048576).toFixed(2) + " MB";
  function toast(msg) {
    const t = $("toast"); t.textContent = msg; t.classList.add("show");
    clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 1800);
  }
  function setStats(items) {
    $("stats").innerHTML = items.map(([k, v]) => `<span class="chip">${k} <b>${v}</b></span>`).join("");
  }

  // Core
  function run(minify = false, quiet = false) {
    const text = input.value;
    $("inPanel").classList.remove("invalid");
    if (!text.trim()) {
      lastOutput = ""; outBody.innerHTML = ""; outBody.appendChild(empty);
      dot.className = "dot"; setStats([]); return;
    }
    try {
      let { data, fixed } = parseLenient(text);
      // Rewrite the input with double quotes, except while typing (avoids cursor jumps)
      if (fixed && !quiet) input.value = fixed;
      if ($("sortKeys").checked) data = sortDeep(data);
      const ind = indent === "tab" ? "\t" : +indent;
      lastOutput = minify ? JSON.stringify(data) : JSON.stringify(data, null, ind);
      const lines = lastOutput.split("\n").length;
      outBody.innerHTML =
        `<div class="out code-font"><div class="gutter">${Array.from({ length: lines }, (_, i) => i + 1).join("\n")}</div><pre>${highlight(lastOutput)}</pre></div>`;
      dot.className = "dot ok";
      const { keys, depth } = analyze(data);
      const inSize = new Blob([text]).size, outSize = new Blob([lastOutput]).size;
      setStats([
        ["Status", "Valid"], ["Type", Array.isArray(data) ? "Array" : data === null ? "null" : typeof data === "object" ? "Object" : typeof data],
        ["Keys", keys.toLocaleString()], ["Depth", depth], ["Lines", lines.toLocaleString()],
        ["Size", `${fmtBytes(inSize)} → ${fmtBytes(outSize)}`],
        ...(fixed ? [["Auto-fixed", "Python → JSON"]] : []),
      ]);
      if (!quiet) toast(fixed ? "Converted to valid JSON (quotes, True/False/None)" : minify ? "Minified" : "Formatted");
    } catch (e) {
      lastOutput = "";
      const loc = locate(text, e.message);
      dot.className = "dot err";
      $("inPanel").classList.add("invalid");
      let snippet = "";
      if (loc) {
        const line = text.split("\n")[loc.line - 1] || "";
        snippet = `<br><code>Line ${loc.line}, column ${loc.col}: ${esc(line.trim().slice(0, 120))}</code>`;
      }
      outBody.innerHTML = `<div class="error-box"><strong>Invalid JSON</strong><code>${esc(e.message)}</code>${snippet}</div>`;
      setStats([["Status", "Invalid"]]);
      if (!quiet && loc) { input.focus(); input.setSelectionRange(loc.pos, loc.pos + 1); }
    }
  }

  // Events
  $("formatBtn").onclick = () => run(false);
  $("minifyBtn").onclick = () => run(true);
  $("indentSeg").onclick = (e) => {
    const b = e.target.closest("button"); if (!b) return;
    document.querySelectorAll("#indentSeg button").forEach((x) => x.classList.toggle("on", x === b));
    indent = b.dataset.v; if (input.value.trim()) run(false, true);
  };
  $("sortKeys").onchange = () => input.value.trim() && run(false, true);
  input.addEventListener("input", () => {
    if (!$("live").checked) return;
    clearTimeout(timer); timer = setTimeout(() => run(false, true), 250);
  });
  input.addEventListener("paste", () => setTimeout(() => run(false, false), 0));
  input.addEventListener("keydown", (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key === "Enter") { e.preventDefault(); run(false); }
    if (e.key === "Tab") {
      e.preventDefault();
      const s = input.selectionStart;
      input.setRangeText("  ", s, input.selectionEnd, "end");
    }
  });
  $("clearBtn").onclick = () => { input.value = ""; run(); input.focus(); };
  $("sampleBtn").onclick = () => {
    input.value = '{"hotel":"Sea View Resort","location":{"city":"Kochi","country":"IN"},"rating":4.6,"rooms":[{"type":"Deluxe","rate":4500,"available":true,"amenities":["wifi","breakfast"]},{"type":"Suite","rate":9800,"available":false,"amenities":["wifi","pool","spa"]}],"currency":"INR","discount":null}';
    run(false);
  };
  $("pasteBtn").onclick = async () => {
    try { input.value = await navigator.clipboard.readText(); run(false); }
    catch { toast("Clipboard access blocked — use Ctrl/Cmd+V"); input.focus(); }
  };
  $("copyBtn").onclick = async () => {
    if (!lastOutput) return toast("Nothing to copy");
    try { await navigator.clipboard.writeText(lastOutput); }
    catch {
      const t = document.createElement("textarea"); t.value = lastOutput; document.body.appendChild(t);
      t.select(); document.execCommand("copy"); t.remove();
    }
    toast("Copied to clipboard");
  };
  $("downloadBtn").onclick = () => {
    if (!lastOutput) return toast("Nothing to download");
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([lastOutput], { type: "application/json" }));
    a.download = "formatted.json"; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  };

  // File open + drag and drop
  function loadFile(f) {
    if (!f) return;
    const r = new FileReader();
    r.onload = () => { input.value = r.result; run(false, false); };
    r.readAsText(f);
  }
  $("uploadBtn").onclick = () => $("file").click();
  $("file").onchange = (e) => { loadFile(e.target.files[0]); e.target.value = ""; };
  const inPanel = $("inPanel");
  ["dragenter", "dragover"].forEach((ev) => inPanel.addEventListener(ev, (e) => { e.preventDefault(); inPanel.classList.add("drag"); }));
  ["dragleave", "drop"].forEach((ev) => inPanel.addEventListener(ev, (e) => { e.preventDefault(); inPanel.classList.remove("drag"); }));
  inPanel.addEventListener("drop", (e) => loadFile(e.dataTransfer.files[0]));
</script>
</body>
</html>
